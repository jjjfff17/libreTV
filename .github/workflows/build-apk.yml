name: Build LibreTV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore keystore from cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/keystore.jks
          key: android-keystore-v1

      - name: Generate keystore if missing
        run: |
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias libretv \
              -storepass "$KS_PWD" -keypass "$KS_PWD" \
              -dname "CN=LibreTV,O=LibreTV,C=CN"
          fi
        env:
          KS_PWD: ${{ secrets.KS_PWD }}
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build signed release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KS_PWD }}
          KEY_ALIAS: libretv

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: libretv-apk
          path: app/build/outputs/apk/release/*.apk
